<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tienda</title>
	<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header>
	<h1>Tu tienda</h1>
</header>

<section id="contenido">

	<!-- ===== Productos destacados (2 columnas) ===== -->
	<section id="destacados">
		<h1>Productos destacados</h1>
		<div class="contenedor">
			<div>Producto 1</div>
			<div>Producto 2</div>
		</div>
	</section>

	<!-- ===== Ofertas (3 columnas) ===== -->
	<section id="ofertas">
		<h1>Ofertas</h1>
		<div class="contenedor">
			<div>Producto 1</div>
			<div>Producto 2</div>
			<div>Producto 3</div>
		</div>
	</section>

	<!-- ===== Disponible (4 columnas) ===== -->
	<section id="disponible">
		<h1>Disponible</h1>
		<div class="contenedor">
			<div>Producto 1</div>
			<div>Producto 2</div>
			<div>Producto 3</div>
			<div>Producto 4</div>
		</div>
	</section>

</section>

<footer>
	Derechos Reservados
</footer>

</body>
</html>
