<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Proyectos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #333;
            margin-bottom: 40px;
        }
        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        a {
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            padding: 20px 40px;
            font-size: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Mis Proyectos Web</h1>

    <div class="menu">
        <a href="tienda/">🛒 Ir a la Tienda</a>
        <a href="parque/">🌳 Ir al Parque</a>
        <a href="modelo-caja/">📦 Ir al Modelo de Caja</a>
    </div>

</body>
</html>
